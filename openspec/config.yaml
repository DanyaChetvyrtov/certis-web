schema: spec-driven

context: |
  Certis Web is the frontend application of the Certis personal finance platform.

  Tech stack:
  - React 19
  - TypeScript 6
  - Vite 8
  - React Router 7
  - Recharts 3
  - i18next + react-i18next
  - Radix UI
  - Vitest
  - Testing Library
  - MSW
  - ESLint

  Architecture:
  - Feature-Sliced Design (FSD) is the standard for new product code.
  - Dependencies point app -> pages -> widgets -> features -> entities -> shared.
  - Cross-slice imports use public index.ts entry points; create layers only when needed.
  - src/pages/transactions, src/pages/accounts, src/widgets/workspace-shell,
    and src/features/transaction-navigation are migrated slices.
  - Other broad src/features/* modules, src/components and src/i18n
    remain legacy/transitional and migrate incrementally.
  - Exact allowed imports from migrated slices into legacy modules are listed in
    scripts/fsd-legacy-imports.mjs and explained in docs/architecture.md.
  - UI CSS belongs beside its page, widget or component owner. Global theme
    primitives remain application-level concerns during migration.

  Backend:
  - certis-api is a separate repository.
  - Do not assume backend changes can be made as part of a certis-web change.
  - Existing API contracts should be preserved unless the change explicitly
    states that a backend contract has already changed.

  Product:
  - The UI supports both English and Russian.
  - The UI supports light and dark themes.
  - The application supports multiple currencies.

  Quality:
  - Prefer existing components and patterns over introducing duplicates.
  - Avoid unnecessary cross-feature dependencies.
  - New behavior should have automated tests when practical.
  - Before completing implementation run:
    npm run lint
    npm test
    npm run build

rules:
  proposal:
    - Clearly state the user-facing problem being solved.
    - Explicitly state what is out of scope.
    - Identify affected Certis Web features.

  specs:
    - Describe observable user behavior rather than implementation details.
    - Include acceptance scenarios for important behavior and edge cases.
    - Consider localization when new user-facing text is introduced.
    - Consider both light and dark themes when UI is changed.

  design:
    - Use FSD placement for new product code and describe any legacy integrations.
    - Identify existing components, hooks, and API clients that can be reused.
    - Explicitly describe any API contract assumptions.
    - Avoid introducing new shared abstractions unless multiple features need them.

  tasks:
    - Separate implementation and automated test tasks.
    - Include localization updates when user-facing text changes.
    - Finish with lint, test, and production build verification.
