name: Build and deploy web image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Push the image and deploy this revision to production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_NAME: danilchet/certis-web

jobs:
  quality-gate:
    name: CI quality gate
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write
      pull-requests: read

  build-image:
    name: Build Docker image
    needs: quality-gate
    if: >-
      ${{
        always() &&
        (
          (github.event_name == 'workflow_dispatch' && !inputs.deploy) ||
          needs.quality-gate.result == 'success'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
        uses: docker/login-action@v3
        with:
          username: danilchet
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy web container
    needs:
      - quality-gate
      - build-image
    if: >-
      ${{
        needs.quality-gate.result == 'success' &&
        needs.build-image.result == 'success' &&
        (
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy)
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: certis-web-production
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull image and recreate web container
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          cd /opt/certis

          docker compose -f docker-compose.prod.yml pull web
          docker compose -f docker-compose.prod.yml \
            up -d --no-deps --force-recreate --wait --wait-timeout 120 web
          docker compose -f docker-compose.prod.yml ps web
          REMOTE_SCRIPT
